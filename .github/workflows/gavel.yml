name: Gavel
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Mirrors the `test` job in test.yml: same runner, timeout, provisioning and
  # scope. The only differences are the ones gavel itself requires — write
  # permissions for the sticky PR comment, an explicit `make envtest` (gavel
  # invokes packages directly instead of going through `make test`, so it does
  # not pick up envtest via the target's prerequisites), and the two package
  # ignores that reproduce `gotest`'s --skip-package=tests/e2e plus the ginkgo
  # runner's inability to run ./bench's Go benchmarks.
  gavel:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    name: gavel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Go
        id: go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v5
        with:
          go-version: 1.26.x
          cache: false
      - name: Cache Go modules and build outputs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - name: Install deps
        uses: flanksource/deps@ce24920a5f27748e5a027b96b91603343288021e # v1.0.42
        with:
          tools: |
            bun
            uv
            powershell
            postgrest
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ./scrapers boots envtest with a hard-coded BinaryAssetsDirectory of .bin.
      - name: Setup envtest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make envtest
      - uses: flanksource/gavel@ce9724f2970b378bdca07ae207308fe61303bcfb # main
        with:
          args: test --ignore tests/e2e --ignore bench
          version: latest
          comment: "true"
          comment-header: gavel
          fail-on-error: "true"
          artifact-name: gavel-results
