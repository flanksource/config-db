name: Lint
on:
  pull_request:

permissions:
  contents: read

jobs:
  golangci:
    permissions:
      contents: read # for actions/checkout to fetch code
      pull-requests: read # for golangci/golangci-lint-action to fetch pull requests
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v5
        with:
          go-version: 1.26.x
          # setup-go's own cache would store ~/go/pkg/mod a second time under its
          # own key, competing for the same 10GB repo budget as the shared entry.
          cache: false

      # Non-strict: this workflow has no `needs:` edge to a job that writes the
      # cache, so a cold key here has to degrade to a slow build, not a red check.
      - name: Restore Go caches
        uses: ./.github/actions/go-cache

      - run: make resources
      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
