apiVersion: configs.flanksource.com/v1
kind: ScrapeConfig
metadata:
  name: github
spec:
  schedule: '@every 6h'
  github:
    - security: true
      openssf: true
      permissions:
        enabled: true
      repositories:
        - owner: flanksource
          repo: duty
      # settings and apps need a token with admin:org held by an organization
      # owner, members needs read:org.
      organizations:
        - name: flanksource
          settings: true
          apps: true
          members: true
