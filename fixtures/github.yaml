apiVersion: configs.flanksource.com/v1
kind: ScrapeConfig
metadata:
  name: github
spec:
  schedule: '@every 6h'
  github:
    - security: true
      openssf: true
      permissions:
        enabled: true
      repositories:
        - owner: flanksource
          repo: duty
      # rulesets needs organization Administration write access; settings and
      # apps need Administration read access; members needs Members read access.
      organizations:
        - name: flanksource
          settings: true
          rulesets: false
          apps: true
          members: true
