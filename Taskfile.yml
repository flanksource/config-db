version: "3"

vars:
  APP_NAME: config-db
  REGISTRY: '{{.REGISTRY | default "docker.lab"}}'
  IMAGE: '{{.REGISTRY}}/{{.APP_NAME}}'
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  image:lab:
    desc: "Build and push the config-db image to the lab registry. Defaults REGISTRY=docker.lab; override with REGISTRY=docker.example.com."
    cmds:
      - docker buildx build --platform linux/amd64 --push . -f build/Dockerfile -t {{.IMAGE}}:{{.VERSION}} -t {{.IMAGE}}:latest

  deploy:lab:
    desc: "Build, push, and patch the running config-db deployment in the current kubectl context. Defaults REGISTRY=docker.lab."
    deps: [image:lab]
    vars:
      CURRENT_NAMESPACE:
        sh: kubectl config view --minify --output 'jsonpath={..namespace}' 2>/dev/null || echo "default"
      DEPLOYMENT:
        sh: |
          ns={{.CURRENT_NAMESPACE | default "default"}}
          name=$(kubectl -n "$ns" get deploy \
            -l app.kubernetes.io/name={{.APP_NAME}} \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -z "$name" ]; then
            name=$(kubectl -n "$ns" get deploy \
              -o jsonpath='{.items[?(@.metadata.name=="{{.APP_NAME}}")].metadata.name}' 2>/dev/null || true)
          fi
          echo "${name:-{{.APP_NAME}}}"
    cmds:
      - echo "Patching deploy/{{.DEPLOYMENT}} in namespace {{.CURRENT_NAMESPACE}} -> {{.IMAGE}}:{{.VERSION}}"
      - >-
        kubectl -n {{.CURRENT_NAMESPACE}} set image
        deploy/{{.DEPLOYMENT}}
        {{.APP_NAME}}={{.IMAGE}}:{{.VERSION}}
      - kubectl -n {{.CURRENT_NAMESPACE}} rollout restart deploy/{{.DEPLOYMENT}}
      - kubectl -n {{.CURRENT_NAMESPACE}} rollout status deploy/{{.DEPLOYMENT}} --timeout=300s

  build:
    desc: "Build the scrapeui bundle then the Go binary."
    deps: [build:ui]
    cmds:
      - make build

  build:ui:
    desc: "Install npm deps and build the embedded scrapeui Vite bundle."
    dir: cmd/scrapeui/frontend
    sources:
      - src/**/*
      - package.json
      - package-lock.json
      - vite.config.ts
      - tsconfig.json
    generates:
      - dist/scrapeui.js
    cmds:
      - npm install
      - npm run build

  build:ui:dev:
    desc: "Run the scrapeui Vite dev server (live reload)."
    dir: cmd/scrapeui/frontend
    cmds:
      - npm install
      - npm run dev

  bench:memory:envtest:
    desc: "Ensure envtest kube-apiserver and etcd binaries are installed."
    vars:
      ENVTEST_K8S_VERSION: '{{.ENVTEST_K8S_VERSION | default "1.34.x"}}'
      ENVTEST_DIR: '{{.ROOT_DIR}}/.bin/envtest'
    cmds:
      - mkdir -p {{.ENVTEST_DIR}}
      - go run sigs.k8s.io/controller-runtime/tools/setup-envtest@latest use {{.ENVTEST_K8S_VERSION}} --bin-dir {{.ENVTEST_DIR}} -p path > {{.ENVTEST_DIR}}/assets.path
      - test -x "$(cat {{.ENVTEST_DIR}}/assets.path)/kube-apiserver"
      - test -x "$(cat {{.ENVTEST_DIR}}/assets.path)/etcd"

  bench:memory:build:
    desc: "Build config-db binary for memory benchmark."
    cmds:
      - mkdir -p .bin
      - go build -o .bin/config-db .

  bench:memory:
    desc: "Run the sealed config-db Kubernetes watch memory benchmark."
    deps: [bench:memory:envtest, bench:memory:build]
    vars:
      BENCH_DB_URL: '{{.BENCH_DB_URL | default ""}}'
      ARTIFACTS_DIR:
        sh: 'echo "${ARTIFACTS_DIR:-bench-memory-results/$(date +%Y%m%d-%H%M%S)}"'
      TEST_TIMEOUT: '{{.TEST_TIMEOUT | default "3h"}}'
    cmds:
      - mkdir -p {{.ARTIFACTS_DIR}}
      - |
        KUBEBUILDER_ASSETS="$(cat .bin/envtest/assets.path)" \
        CONFIG_DB_MEMORY_BENCH=1 \
        CONFIG_DB_BIN="{{.ROOT_DIR}}/.bin/config-db" \
        BENCH_DB_URL='{{.BENCH_DB_URL}}' \
        BENCH_ARTIFACTS_DIR='{{.ARTIFACTS_DIR}}' \
        go test ./bench/memory \
          -run '^TestConfigDBKubernetesWatchMemory$' \
          -count=1 \
          -timeout {{.TEST_TIMEOUT}} \
          -v
